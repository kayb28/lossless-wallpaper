name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Firma estable: el keystore vive CIFRADO en los secrets del repositorio
      # (KEYSTORE_BASE64 y KEYSTORE_PASSWORD), nunca en archivos del repo.
      # Si los secrets no existen (p. ej. forks), se genera uno efímero solo
      # para esa corrida: el APK instala igual, pero las actualizaciones
      # posteriores exigirán desinstalar antes.
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD_SECRET" ]; then
            echo "Using stable keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            printf '%s' "$KEYSTORE_PASSWORD_SECRET" > "$RUNNER_TEMP/.kp"
            echo "KEYSTORE_PASSWORD=$(cat "$RUNNER_TEMP/.kp")" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=wallpaper" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$(cat "$RUNNER_TEMP/.kp")" >> "$GITHUB_ENV"
            rm -f "$RUNNER_TEMP/.kp"
          else
            echo "Secrets not found: generating a one-run ephemeral keystore."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias wallpaper \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Lossless Wallpaper CI" >/dev/null 2>&1
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=wallpaper" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Run tests and build release APK
        run: ./gradlew test assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lossless-wallpaper-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
